server:
  port: 8080

spring:
  application:
    name: pix-simulator

  # ── Banco de dados H2 (in-memory) ──────────────────────────────────────
  # Não requer PostgreSQL nem container Docker para o banco.
  # O schema é criado automaticamente pelo Hibernate ao iniciar.
  # Console disponível em: http://localhost:8080/h2-console
  # JDBC URL no console: jdbc:h2:mem:pixdb
  datasource:
    url: jdbc:h2:mem:pixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  # ── Redis — camada de idempotência ─────────────────────────────────────
  # Requer Redis rodando via Docker antes de iniciar a aplicação.
  # Adicionado ao docker-compose.yml junto com o Kafka.
  data:
    redis:
      host: localhost
      port: 6379
      # Em produção: configurar senha via variável de ambiente
      # password: ${REDIS_PASSWORD}
      timeout: 2000ms  # timeout de conexão (2s — falha rápida se Redis indisponível)
      lettuce:
        pool:
          max-active: 8   # máximo de conexões ativas
          max-idle: 4     # máximo de conexões ociosas no pool
          min-idle: 1     # mínimo de conexões sempre abertas


  jpa:
    hibernate:
      # create-drop: recria o schema a cada inicialização (ideal para demos e testes)
      # Em produção: usar 'validate' ou gerenciar migrations com Flyway/Liquibase
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false  # Desativa OSIV — evita LazyInitializationException silenciosa
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  # ── Kafka ──────────────────────────────────────────────────────────────
  # Requer Kafka rodando via Docker antes de iniciar a aplicação.
  # Comando: docker-compose up -d
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all: aguarda confirmação de todos os brokers (mais seguro, levemente mais lento)
      acks: all
      # Retentativas automáticas em caso de falha transitória de rede
      retries: 3
      properties:
        # Garante que mensagens com a mesma chave cheguem na ordem de envio
        enable.idempotence: true
    consumer:
      group-id: pix-group
      # earliest: começa a ler do início do tópico (útil para reprocessamento)
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Lista de pacotes cujas classes podem ser deserializadas (segurança)
        spring.json.trusted.packages: "com.pix.*"
        # Desabilita mapeamento de tipo do header — usa a classe configurada
        spring.json.use.type.headers: false

# ── JWT ──────────────────────────────────────────────────────────────────
# Segredo mínimo de 256 bits para o algoritmo HS256.
# EM PRODUÇÃO: usar variável de ambiente — NUNCA commitar segredos no código.
# Exemplo: app.jwt.secret=${JWT_SECRET}
app:
  jwt:
    secret: "pix-simulator-super-secret-key-must-be-at-least-256-bits-long-here"
    expiration: 86400000  # 24 horas em milissegundos


  # ── Idempotência Redis ─────────────────────────────────────────────────
  idempotency:
    # TTL da chave de idempotência no Redis (em horas)
    # Após este período, a chave expira e o mesmo UUID pode ser reutilizado
    ttl-hours: 24
    # TTL do lock distribuído (em segundos)
    # Proteção contra lock eterno se a aplicação crashar durante o processamento
    lock-seconds: 30

  # ── Detecção de anomalias ───────────────────────────────────────────────
  anomaly:
    # Uma transação é FLAGGED se: valor_atual > média_30_dias * multiplier
    # Padrão: qualquer PIX mais de 10× acima da média histórica é suspeito
    threshold-multiplier: 10.0
    # Mínimo de transações COMPLETED para calcular média significativa
    # Se histórico insuficiente, a verificação é ignorada (sem baseline)
    min-history-count: 3

  # ── Nomes dos tópicos Kafka ─────────────────────────────────────────────
  kafka:
    topics:
      pix-created: pix.created      # publicado após aceitar o PIX (PENDING criado)
      pix-completed: pix.completed  # publicado após processar com sucesso (COMPLETED)
      pix-alert: pix.alert          # publicado quando anomalia é detectada

# ── Swagger / OpenAPI ───────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  # Não redireciona / para /swagger-ui.html (o frontend já faz isso)
  swagger-ui.disable-swagger-default-url: true

# ── Logging ──────────────────────────────────────────────────────────────
logging:
  level:
    com.pix: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
