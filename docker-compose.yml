# ============================================================
# PIX Simulator — Infraestrutura Docker
# ============================================================
#
# Este projeto usa H2 in-memory para o banco de dados.
# Apenas o Kafka precisa rodar via Docker.
#
# Comandos:
#   docker-compose up -d          → sobe o Kafka em background
#   docker-compose down           → para e remove os containers
#   docker-compose logs -f kafka  → acompanha os logs do Kafka
#   docker-compose ps             → verifica o status dos containers
#
# Após subir o Kafka, inicie a aplicação Spring Boot:
#   mvn spring-boot:run
#
# URLs disponíveis:
#   http://localhost:8080               → Frontend
#   http://localhost:8080/swagger-ui.html → Documentação da API
#   http://localhost:8080/h2-console    → Console do banco (sa / sem senha)

services:


  # ── Redis — cache de idempotência ───────────────────────────────────────
  #
  # Armazena as chaves de idempotência com TTL automático de 24h.
  # Cada chave PIX processada fica no formato:
  #   "pix:idempotency:{uuid}" → {json com dados da transação}
  #
  # Por que Redis e não apenas o banco?
  # - Lookup em ~0.1ms (vs ~5-20ms com SQL)
  # - TTL nativo: chaves expiram automaticamente sem jobs de limpeza
  # - SETNX atômico: lock distribuído sem race conditions
  # - In-memory: não gera I/O em disco para cada verificação de idempotência
  #
  # redis:7-alpine: variante mínima (~30MB) — ideal para desenvolvimento
  redis:
    image: redis:7-alpine
    container_name: pix-redis
    ports:
      # A aplicação Spring Boot conecta nesta porta (spring.data.redis.port: 6379)
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
    # Configurações:
    # --appendonly yes: persistência AOF (dados sobrevivem a restart do container)
    # --appendfsync everysec: flush em disco a cada 1s (equilíbrio performance/durabilidade)
    # --maxmemory 128mb: limite de memória — evita consumo excessivo em dev
    # --maxmemory-policy allkeys-lru: quando cheio, remove a chave menos usada recentemente
    volumes:
      # Persiste dados do Redis entre restarts
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Kafka (modo KRaft — sem Zookeeper) ──────────────────────────────────
  #
  # KRaft é o modo moderno do Kafka (desde v3.x) onde o próprio broker
  # gerencia metadados sem depender do Zookeeper.
  # Vantagens: setup mais simples, imagem menor, menos containers.
  #
  # Por que apache/kafka em vez de confluentinc/cp-kafka?
  # - apache/kafka: imagem oficial do Apache (~220 MB, sem Zookeeper)
  # - confluentinc/cp-kafka: requer Zookeeper (~438 MB cada = 876 MB total)
  # Para desenvolvimento local, a imagem oficial é suficiente.
  kafka:
    image: apache/kafka:3.9.0
    container_name: pix-kafka
    ports:
      # A aplicação Spring Boot conecta nesta porta (bootstrap-servers: localhost:9092)
      - "9092:9092"
    environment:
      # ── Identidade do nó ────────────────────────────────────────────────
      KAFKA_NODE_ID: 1
      # Este nó atua como broker (recebe mensagens) E controller (coordenação KRaft)
      KAFKA_PROCESS_ROLES: broker,controller
      # Quorum de controllers: apenas este nó (single-node dev setup)
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      # ── Configuração de listeners ────────────────────────────────────────
      # PLAINTEXT (9092): usado pela aplicação Spring Boot (externo ao container)
      # CONTROLLER (9093): coordenação interna KRaft (não exposta externamente)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # ── Comportamento ───────────────────────────────────────────────────
      # Auto-criação de tópicos: o KafkaConfig.java também cria via @Bean,
      # mas esta configuração serve como fallback
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      # Para desenvolvimento com 1 broker: fator de replicação = 1
      # EM PRODUÇÃO: usar 3 brokers com replicação = 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Retenção de logs reduzida para dev (padrão é 7 dias)
      KAFKA_LOG_RETENTION_HOURS: 1

    volumes:
      # Persiste dados dos tópicos entre restarts do container
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      # Verifica se o broker está respondendo listando os tópicos
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      # Aguarda 30s antes de começar a verificar (Kafka demora para iniciar)
      start_period: 30s

volumes:
  redis_data:
    driver: local
    # Dados ficam em: ~/.docker/volumes/pix-simulator_redis_data
  kafka_data:
    driver: local
    # Dados ficam em: ~/.docker/volumes/pix-simulator_kafka_data
    # Para resetar completamente: docker-compose down -v
